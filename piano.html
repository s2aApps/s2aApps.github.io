<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Piano</title>

<style>
* {
    box-sizing: border-box;
}

body.embed {
    padding: 12px;
    min-height: auto;
    align-items: stretch;
}

body.embed header {
    margin-bottom: 12px;
}

body.embed h1 {
    font-size: clamp(22px, 4vw, 34px);
    letter-spacing: 2px;
}

body.embed .subtitle,
body.embed .site-back {
    display: none;
}

.site-back {
    display: inline-block;
    margin-bottom: 12px;
    color: #93c5fd;
    text-decoration: none;
    font-size: 14px;
}

.site-back:hover {
    text-decoration: underline;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #26334a, #0b0e14 65%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.app {
    width: min(1100px, 100%);
}

header {
    text-align: center;
    margin-bottom: 22px;
}

h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 52px);
    letter-spacing: 4px;
}

.subtitle {
    margin-top: 8px;
    color: #aeb8c9;
}

.panel {
    background: rgba(20, 25, 35, 0.9);
    border: 1px solid #394457;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
}

button, select {
    border: 1px solid #46536a;
    background: #202938;
    color: white;
    padding: 11px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
}

button:hover, select:hover {
    background: #2b374a;
}

button.active {
    background: #3b82f6;
    border-color: #60a5fa;
}

.volume {
    display: flex;
    align-items: center;
    gap: 8px;
}

input[type="range"] {
    width: 120px;
}

.status {
    text-align: center;
    min-height: 25px;
    color: #9ca9bd;
    margin-bottom: 15px;
}

.piano-wrapper {
    overflow-x: auto;
    padding-bottom: 10px;
}

.piano {
    position: relative;
    height: 330px;
    min-width: 850px;
    display: flex;
    user-select: none;
    touch-action: none;
}

.key {
    position: relative;
    cursor: pointer;
    transition: transform .05s, filter .05s;
}

.white {
    flex: 1;
    height: 330px;
    background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #f1f1f1 80%,
        #c9c9c9 100%
    );
    border: 1px solid #888;
    border-radius: 0 0 8px 8px;
    color: #333;
    z-index: 1;
}

.white span {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: bold;
    font-size: 13px;
}

.black {
    position: absolute;
    width: 55px;
    height: 205px;
    top: 0;
    background: linear-gradient(
        to right,
        #111,
        #303030 45%,
        #050505
    );
    border-radius: 0 0 7px 7px;
    border: 1px solid #000;
    z-index: 3;
    box-shadow: 0 8px 10px rgba(0,0,0,.45);
}

.black span {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: #aaa;
}

.key.active {
    filter: brightness(1.25);
}

.white.active {
    transform: translateY(4px);
    background: linear-gradient(
        to bottom,
        #dbeafe,
        #bfdbfe,
        #93c5fd
    );
}

.black.active {
    transform: translateY(4px);
    background: linear-gradient(
        to right,
        #172554,
        #2563eb,
        #172554
    );
}

.info {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.card {
    background: #151c28;
    border: 1px solid #303b4d;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.card strong {
    display: block;
    font-size: 20px;
    margin-bottom: 5px;
}

.card small {
    color: #9ca9bd;
}

.recording {
    color: #ff6b6b;
}

@media (max-width: 650px) {
    body {
        padding: 10px;
    }

    .panel {
        padding: 12px;
    }

    .info {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<a class="site-back" href="../index.html#nandu-lab">← Back to S2A Apps</a>

<header>
    <h1>🎹 VIRTUAL PIANO</h1>
    <div class="subtitle">
        Built by Nandu · Play with mouse, touch, or keyboard
    </div>
</header>

<div class="panel">

    <div class="controls">

        <button id="recordBtn">● Record</button>
        <button id="playBtn">▶ Play</button>
        <button id="clearBtn">✕ Clear</button>

        <select id="waveform">
            <option value="sine">Soft</option>
            <option value="triangle" selected>Grand Piano</option>
            <option value="square">Electronic</option>
            <option value="sawtooth">Bright</option>
        </select>

        <div class="volume">
            🔊
            <input id="volume" type="range" min="0" max="100" value="70">
        </div>

    </div>

    <div id="status" class="status">
        Ready — press a key!
    </div>

    <div class="piano-wrapper">
        <div class="piano" id="piano">

            <!-- WHITE KEYS -->
            <div class="key white" data-note="C4" data-key="a">
                <span>A</span>
            </div>

            <div class="key white" data-note="D4" data-key="s">
                <span>S</span>
            </div>

            <div class="key white" data-note="E4" data-key="d">
                <span>D</span>
            </div>

            <div class="key white" data-note="F4" data-key="f">
                <span>F</span>
            </div>

            <div class="key white" data-note="G4" data-key="g">
                <span>G</span>
            </div>

            <div class="key white" data-note="A4" data-key="h">
                <span>H</span>
            </div>

            <div class="key white" data-note="B4" data-key="j">
                <span>J</span>
            </div>

            <div class="key white" data-note="C5" data-key="k">
                <span>K</span>
            </div>

            <div class="key white" data-note="D5" data-key="l">
                <span>L</span>
            </div>

            <div class="key white" data-note="E5" data-key=";">
                <span>;</span>
            </div>

            <!-- BLACK KEYS -->
            <div class="key black" data-note="C#4" data-key="w" style="left:7.5%;">
                <span>W</span>
            </div>

            <div class="key black" data-note="D#4" data-key="e" style="left:17.5%;">
                <span>E</span>
            </div>

            <div class="key black" data-note="F#4" data-key="t" style="left:37.5%;">
                <span>T</span>
            </div>

            <div class="key black" data-note="G#4" data-key="y" style="left:47.5%;">
                <span>Y</span>
            </div>

            <div class="key black" data-note="A#4" data-key="u" style="left:57.5%;">
                <span>U</span>
            </div>

            <div class="key black" data-note="C#5" data-key="i" style="left:77.5%;">
                <span>I</span>
            </div>

            <div class="key black" data-note="D#5" data-key="o" style="left:87.5%;">
                <span>O</span>
            </div>

        </div>
    </div>

    <div class="info">

        <div class="card">
            <strong id="currentNote">—</strong>
            <small>Current Note</small>
        </div>

        <div class="card">
            <strong id="noteCount">0</strong>
            <small>Recorded Notes</small>
        </div>

        <div class="card">
            <strong id="octave">4</strong>
            <small>Octave</small>
        </div>

    </div>

</div>
</div>

<script>
let audioContext = null;
let masterGain = null;

const activeVoices = new Map();
const pressedKeys = new Set();

let recording = false;
let recordedNotes = [];
let recordStart = 0;
let isPlaying = false;

const frequencies = {
    C4: 261.63,
    "C#4": 277.18,
    D4: 293.66,
    "D#4": 311.13,
    E4: 329.63,
    F4: 349.23,
    "F#4": 369.99,
    G4: 392.00,
    "G#4": 415.30,
    A4: 440.00,
    "A#4": 466.16,
    B4: 493.88,
    C5: 523.25,
    "C#5": 554.37,
    D5: 587.33,
    "D#5": 622.25,
    E5: 659.25
};

const piano = document.getElementById("piano");
const status = document.getElementById("status");
const currentNote = document.getElementById("currentNote");
const noteCount = document.getElementById("noteCount");
const recordBtn = document.getElementById("recordBtn");
const playBtn = document.getElementById("playBtn");
const clearBtn = document.getElementById("clearBtn");
const volume = document.getElementById("volume");
const waveform = document.getElementById("waveform");

function initAudio() {
    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        masterGain = audioContext.createGain();
        masterGain.gain.value = volume.value / 100;
        masterGain.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

volume.addEventListener("input", () => {
    if (masterGain) {
        masterGain.gain.value = volume.value / 100;
    }
});

function playNote(note) {
    initAudio();

    if (activeVoices.has(note)) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = waveform.value;
    oscillator.frequency.value = frequencies[note];

    const now = audioContext.currentTime;

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.9, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(
        0.35,
        now + 0.15
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start();

    activeVoices.set(note, {
        oscillator,
        gain
    });

    currentNote.textContent = note;

    const key = getKey(note);
    if (key) key.classList.add("active");

    if (recording && !isPlaying) {
        recordedNotes.push({
            note: note,
            time: performance.now() - recordStart
        });

        noteCount.textContent = recordedNotes.length;
    }
}

function stopNote(note) {
    const voice = activeVoices.get(note);

    if (!voice) return;

    const now = audioContext.currentTime;

    voice.gain.gain.cancelScheduledValues(now);
    voice.gain.gain.setTargetAtTime(
        0.001,
        now,
        0.06
    );

    voice.oscillator.stop(now + 0.3);

    activeVoices.delete(note);

    const key = getKey(note);
    if (key) key.classList.remove("active");
}

function getKey(note) {
    return document.querySelector(
        `.key[data-note="${note}"]`
    );
}

function pressKey(key) {
    if (!key || pressedKeys.has(key)) return;

    pressedKeys.add(key);

    const note = key.dataset.note;
    playNote(note);
}

function releaseKey(key) {
    if (!key) return;

    pressedKeys.delete(key);

    const note = key.dataset.note;
    stopNote(note);
}

/* Mouse + touch */

document.querySelectorAll(".key").forEach(key => {

    key.addEventListener("pointerdown", event => {
        event.preventDefault();
        key.setPointerCapture(event.pointerId);
        pressKey(key);
    });

    key.addEventListener("pointerup", event => {
        event.preventDefault();
        releaseKey(key);
    });

    key.addEventListener("pointercancel", () => {
        releaseKey(key);
    });

    key.addEventListener("pointerleave", event => {
        if (event.buttons === 0) {
            releaseKey(key);
        }
    });
});

/* Computer keyboard */

document.addEventListener("keydown", event => {

    if (event.repeat) return;

    const key = document.querySelector(
        `.key[data-key="${event.key.toLowerCase()}"]`
    );

    if (key) {
        event.preventDefault();
        pressKey(key);
    }
});

document.addEventListener("keyup", event => {

    const key = document.querySelector(
        `.key[data-key="${event.key.toLowerCase()}"]`
    );

    if (key) {
        releaseKey(key);
    }
});

/* Recording */

recordBtn.addEventListener("click", () => {

    if (isPlaying) return;

    if (!recording) {

        recordedNotes = [];
        noteCount.textContent = "0";

        recording = true;
        recordStart = performance.now();

        recordBtn.classList.add("active");
        recordBtn.textContent = "■ Stop";

        status.textContent = "Recording...";

    } else {

        recording = false;

        recordBtn.classList.remove("active");
        recordBtn.textContent = "● Record";

        status.textContent =
            recordedNotes.length +
            " notes recorded";
    }
});

/* Playback */

playBtn.addEventListener("click", async () => {

    if (recordedNotes.length === 0 || isPlaying) {
        status.textContent = "Nothing recorded yet.";
        return;
    }

    isPlaying = true;
    playBtn.classList.add("active");
    status.textContent = "Playing recording...";

    for (let i = 0; i < recordedNotes.length; i++) {

        const item = recordedNotes[i];

        if (i > 0) {
            const previous =
                recordedNotes[i - 1];

            await wait(
                Math.max(
                    0,
                    item.time - previous.time
                )
            );
        }

        playNote(item.note);

        setTimeout(() => {
            stopNote(item.note);
        }, 300);
    }

    await wait(350);

    isPlaying = false;
    playBtn.classList.remove("active");

    status.textContent = "Playback finished.";
});

/* Clear */

clearBtn.addEventListener("click", () => {

    recordedNotes = [];
    noteCount.textContent = "0";

    status.textContent = "Recording cleared.";
});

/* Utility */

function wait(ms) {
    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );
}

if (window.self !== window.top) {
    document.body.classList.add("embed");
}
</script>

</body>
</html>
